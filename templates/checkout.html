{% extends "base.html" %}
{% block content %}

<div class="container text-center py-5">

    <h2>Secure Checkout</h2>

    <div class="card mx-auto p-4 shadow-lg" style="max-width: 400px; border-radius: 18px;">

        <h4>₹99 Payment</h4>
        <p class="text-muted">Demo secure payment</p>

        <input class="form-control mb-2" placeholder="Card Number">

        <a href="{% url 'payment_processing' %}" class="btn btn-primary w-100">
            Pay Now

    </div>

</div>

{% endblock %}
