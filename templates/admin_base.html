<!DOCTYPE html>
<html>
<head>
    <title>Admin Panel - DishDeck</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>
        body {
            background: #f4f6f9;
        }

        .admin-nav {
            background: #111;
            padding: 15px 40px;
            color: white;
        }

        .admin-nav a {
            color: white;
            text-decoration: none;
            margin-right: 20px;
        }

        .admin-nav a:hover {
            text-decoration: underline;
        }
    </style>
</head>
<body>

<!-- ADMIN NAV -->
<div class="admin-nav d-flex justify-content-between">
    <div>
        <strong>DishDeck Admin</strong>
    </div>

    <div>
        <a href="{% url 'admindashboard' %}">Dashboard</a>
        <a href="{% url 'add_recipe' %}">Add Recipe</a>
        <a href="{% url 'index' %}">Home</a>
    </div>
</div>

<div class="container mt-4">
    {% block content %}
    {% endblock %}
</div>

</body>
</html>
