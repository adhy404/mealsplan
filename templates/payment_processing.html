<!DOCTYPE html>
<html>
<head>
    <title>Payment Processing</title>
    <style>
        body {
            font-family: Arial;
            background: #f4f6f9;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }

        .card {
            background: white;
            padding: 30px;
            border-radius: 12px;
            width: 350px;
            text-align: center;
            box-shadow: 0px 10px 30px rgba(0,0,0,0.1);
        }

        .loader {
            border: 6px solid #eee;
            border-top: 6px solid #3498db;
            border-radius: 50%;
            width: 60px;
            height: 60px;
            margin: 20px auto;
            animation: spin 1s linear infinite;
        }

        @keyframes spin {
            0% { transform: rotate(0deg);}
            100% { transform: rotate(360deg);}
        }

        .btn {
            margin-top: 20px;
            padding: 10px 15px;
            background: #27ae60;
            color: white;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            text-decoration: none;
            display: inline-block;
        }

        .text {
            color: #555;
        }
    </style>
</head>
<body>

<div class="card">
    <h2>Processing Payment</h2>

    <div class="loader"></div>

    <p class="text">Please wait while we verify your payment...</p>

    <p>Amount: <b>₹499 (Demo)</b></p>

    <a href="/payment-success/" class="btn">Skip to Success (Demo)</a>
</div>

<script>
    // Auto redirect after 4 seconds (simulation)
    setTimeout(() => {
        window.location.href = "/payment-success/";
    }, 4000);
</script>

</body>
</html>
