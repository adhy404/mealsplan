{% extends "admin_base.html" %}

{% block content %}

<h2>Admin Dashboard</h2>

<a href="{% url 'add_recipe' %}" class="btn btn-success">Add New Recipe</a>

<h3>All Recipes</h3>

<table class="table">
    <tr>
        <th>Title</th>
        <th>Actions</th>
    </tr>

    {% for recipe in recipes %}
    <tr>
        <td>{{ recipe.title }}</td>
        <td>
            <a href="{% url 'edit_recipe' recipe.id %}" class="btn btn-primary">Edit</a>
            <a href="{% url 'delete_recipe' recipe.id %}" class="btn btn-danger">Delete</a>
        </td>
    </tr>
    {% empty %}
    <tr>
        <td colspan="2">No recipes added yet.</td>
    </tr>
    {% endfor %}
</table>

{% endblock %}
