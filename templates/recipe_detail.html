<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">
<title>{{ recipe.title }}</title>
<meta name="viewport" content="width=device-width, initial-scale=1">

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">

<style>

body{
background:#f6f6f6;
font-family:'Segoe UI',sans-serif;
}

.recipe-container{
background:white;
border-radius:20px;
padding:30px;
}

.recipe-img{
height:380px;
object-fit:cover;
border-radius:15px;
}

.section-title{
margin-top:30px;
font-weight:600;
}

.info-box{
background:#f1f1f1;
padding:10px 20px;
border-radius:10px;
margin-right:10px;
}

.favorite-btn{
border:none;
background:#ff4d6d;
color:white;
padding:8px 18px;
border-radius:25px;
}

.rating i{
color:gold;
font-size:20px;
}

</style>

</head>

<body>

<div class="container mt-5">

<a href="{% url 'index' %}" class="btn btn-outline-dark mb-4">
← Back
</a>

<div class="recipe-container shadow">

<h2 class="text-center mb-3">{{ recipe.title }}</h2>

{% if recipe.image %}
<img src="{{ recipe.image.url }}" class="img-fluid recipe-img w-100 mb-4">
{% endif %}

<p class="text-muted text-center">
{{ recipe.description }}
</p>


<!-- Cooking Info -->
<div class="d-flex justify-content-center mt-3 mb-3">

<div class="info-box">
⏱ {{ recipe.cooking_time }} mins
</div>

<div class="info-box">
🍽 {{ recipe.servings }} servings
</div>

</div>


<!-- Rating -->
<div class="text-center rating mb-3">

<i>⭐</i>
<i>⭐</i>
<i>⭐</i>
<i>⭐</i>
<i>⭐</i>

</div>


<!-- Favorite Button -->

<div class="text-center mb-4">

<form method="POST" action="{% url 'toggle_favorite' recipe.id %}">
{% csrf_token %}

<button class="favorite-btn">
❤️ Favorite
</button>

</form>

</div>


<hr>


<!-- Ingredients -->

<h4 class="section-title">🥗 Ingredients</h4>

<p style="white-space:pre-line;">
{{ recipe.ingredients }}
</p>

<hr>


<!-- Steps -->

<h4 class="section-title">👨‍🍳 Cooking Steps</h4>

<p style="white-space:pre-line;">
{{ recipe.steps }}
</p>

</div>

</div>

</body>
</html>
