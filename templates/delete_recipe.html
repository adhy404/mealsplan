{% extends "base.html" %}

{% block content %}
<div class="container mt-5">

    <div class="card shadow-sm p-4 text-center">
        <h3 class="text-danger">Delete Recipe</h3>

        <p>Are you sure you want to delete:</p>
        <h4>"{{ recipe.title }}"</h4>

        <form method="POST">
            {% csrf_token %}
            <button type="submit" class="btn btn-danger">
                Yes, Delete
            </button>

            <a href="{% url 'admindashboard' %}" class="btn btn-secondary ms-2">
                Cancel
            </a>
        </form>
    </div>

</div>
{% endblock %}
