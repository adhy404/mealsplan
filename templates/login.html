<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Login | DishDeck</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>
        body {
            background: #f5f5f5;
            font-family: 'Segoe UI', sans-serif;
        }

        .login-card {
            background: white;
            border-radius: 25px;
            padding: 40px;
        }

        .brand {
            font-weight: 800;
            font-size: 28px;
            color: black;
        }

        .form-control {
            border-radius: 30px;
            padding: 12px 20px;
        }

        .btn-login {
            background: #c6db2d;
            border-radius: 30px;
            padding: 10px;
            font-weight: 600;
            border: none;
        }

        .btn-login:hover {
            background: #b3cc28;
        }

        .home-link {
            text-decoration: none;
            color: black;
            font-weight: 500;
        }
    </style>
</head>
<body>

<div class="container">

    <div class="row justify-content-center align-items-center vh-100">
        <div class="col-md-5">

            <div class="login-card shadow-lg">

                <!-- Brand -->
                <div class="text-center mb-4">
                    <div class="brand">DishDeck</div>
                    <p class="text-muted">Welcome back! Login to continue.</p>
                </div>

                <!-- Error Messages -->
                {% if messages %}
                    {% for message in messages %}
                        <div class="alert alert-danger text-center">
                            {{ message }}
                        </div>
                    {% endfor %}
                {% endif %}

                <!-- Login Form -->
                <form method="POST">
                    {% csrf_token %}

                    <div class="mb-3">
                        <input type="text" name="username" class="form-control"
                               placeholder="Username" required>
                    </div>

                    <div class="mb-3">
                        <input type="password" name="password" class="form-control"
                               placeholder="Password" required>
                    </div>

                    <div class="d-grid">
                        <button type="submit" class="btn btn-login">
                            Login
                        </button>
                    </div>
                </form>

                <div class="text-center mt-4">
                    <p>
                        Don't have an account?
                        <a href="{% url 'user_register' %}" class="home-link">
                            Register here
                        </a>
                    </p>

                    <a href="{% url 'index' %}" class="home-link">
                        ← Back to Home
                    </a>
                </div>

            </div>

        </div>
    </div>

</div>

</body>
</html>
